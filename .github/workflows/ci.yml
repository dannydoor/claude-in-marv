name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: npm test
      - name: Validate repository and plugin boundary
        run: npm run check
      - name: Validate tagged release inputs
        if: matrix.node-version == 22 && startsWith(github.ref, 'refs/tags/v')
        run: npm run check:release
      - name: Build plugin archive
        run: npm run package
      - name: Build Desktop extension from the checked-in runtime
        if: matrix.node-version == 22
        run: npm run package:mcpb
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: foldseek-server-release-candidates
          path: |
            dist/*.plugin
            dist/*.mcpb
          if-no-files-found: error
          retention-days: 7
